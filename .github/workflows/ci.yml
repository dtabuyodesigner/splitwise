name: CI

# Ningún paso necesita secretos y ninguno habla con el Supabase de
# producción. El trabajo `esquema` levanta un PostgreSQL vacío y desechable.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y coherencia
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de todos los archivos JavaScript
        run: |
          for f in js/*.js tools/*.mjs tests/*.js tests/ayudas/*.mjs sw.js; do
            node --check "$f"
          done
          echo "Todos los archivos parsean"

      - name: JSON válido
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"

      - name: Pruebas automatizadas
        run: node --test tests/

      - name: Coherencia de versión, service worker e iconos
        run: node tools/verificar.mjs

      - name: Los iconos se pueden regenerar sin cambios
        # Si regenerarlos produce un diff, es que alguien los ha tocado a mano
        # y el generador ha quedado desfasado.
        run: |
          node tools/generar-iconos.mjs
          git diff --exit-code -- icons/

  esquema:
    name: Las migraciones compilan
    runs-on: ubuntu-latest

    # Solo para poder dejar el log del fallo como comentario en el PR.
    # No se usa ningún secreto propio: GITHUB_TOKEN lo emite Actions.
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: ['5432:5432']

    env:
      PGPASSWORD: prueba
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: prueba

    steps:
      - uses: actions/checkout@v4

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Un trigger ajeno no impide instalar el mecanismo de perfiles
        # Esta base la comparten varias aplicaciones. Se comprueba antes de
        # nada, sobre la base limpia, y se deshace con ROLLBACK.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/00_stub_supabase.sql 2>&1 | tee -a /tmp/salida-sql.log
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/91_trigger_ajeno.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Un trigger que ocupa el nombre esperado ABORTA la migración
        # Prueba negativa. Si 0001 solo avisara, el despliegue terminaría con
        # apariencia de correcto y sin ningún mecanismo que cree perfiles.
        # Todo dentro de una transacción, así que el impostor no queda.
        run: |
          set -eo pipefail
          {
            echo "begin;"
            echo "\\ir $PWD/supabase/pruebas/negativos/nombre_ocupado.sql"
            echo "\\ir $PWD/supabase/migrations/0001_baseline_esquema.sql"
          } > /tmp/nombre_ocupado.sql

          if psql -v ON_ERROR_STOP=1 -f /tmp/nombre_ocupado.sql \
               >> /tmp/salida-sql.log 2>&1; then
            echo "FALLO: 0001 debería abortar si el nombre está ocupado" | tee -a /tmp/salida-sql.log
            exit 1
          fi
          echo "── nombre ocupado: ok · 0001 abortó, como debe" | tee -a /tmp/salida-sql.log

          # Y comprobamos que no ha tocado el trigger ajeno, esta vez sin
          # que la migración corra: se recrea el impostor y se mira el estado.
          {
            echo "begin;"
            echo "\\ir $PWD/supabase/pruebas/negativos/nombre_ocupado.sql"
            echo "\\ir $PWD/supabase/pruebas/90_nombre_ocupado.sql"
            echo "rollback;"
          } > /tmp/nombre_ocupado_check.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/nombre_ocupado_check.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Aplicar las migraciones sobre una base vacía y desechable
        # Esto NO toca ninguna base real. Sirve para comprobar que el SQL del
        # repositorio compila y deja el esquema en el estado esperado.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/00_stub_supabase.sql 2>&1 | tee -a /tmp/salida-sql.log
          # Orden EXPLÍCITO: el glob depende del locale y en algunos
          # 0002b se ordena antes que 0002_group_members.
          # Los mismos pasos y los mismos límites transaccionales que
          # supabase/aplicar-migraciones.sh usará en producción.
          for paso in migrations/0001_baseline_esquema lotes/pertenencia \
                      migrations/0003_restricciones_indices migrations/0004_rls \
                      migrations/0005_realtime migrations/0006_rls_viajes; do
            echo "── aplicando $paso.sql" | tee -a /tmp/salida-sql.log
            psql -v ON_ERROR_STOP=1 --single-transaction \
                 -f "supabase/$paso.sql" 2>&1 | tee -a /tmp/salida-sql.log
          done

      - name: Comprobar el esquema resultante
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/99_comprobaciones.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Pruebas de seguridad ejecutando consultas reales
        # Suplanta a usuarios concretos y comprueba que un extraño no puede
        # leer, escribir ni autoinvitarse a un grupo ajeno. Todo dentro de una
        # transacción que termina en ROLLBACK, sobre la base desechable.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/98_seguridad_dml.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Las migraciones son idempotentes
        # Volver a aplicarlas no debe fallar: es lo que permite reejecutarlas
        # sin miedo si una se queda a medias.
        run: |
          set -eo pipefail
          echo "── reaplicando las migraciones ──" | tee -a /tmp/salida-sql.log
          for paso in migrations/0001_baseline_esquema lotes/pertenencia \
                      migrations/0003_restricciones_indices migrations/0004_rls \
                      migrations/0005_realtime migrations/0006_rls_viajes; do
            psql -v ON_ERROR_STOP=1 --single-transaction \
                 -f "supabase/$paso.sql" 2>&1 | tee -a /tmp/salida-sql.log > /dev/null
          done
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/99_comprobaciones.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Resumen del SQL ejecutado
        if: always()
        run: |
          {
            echo '### Salida de PostgreSQL'
            echo
            echo '```'
            tail -n 200 /tmp/salida-sql.log 2>/dev/null || echo '(sin salida)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dejar constancia del resultado en el PR
        # Los logs de Actions no se pueden leer por API sin permisos extra, así
        # que el resultado de las pruebas de seguridad se publica aquí: en
        # verde, la lista de aserciones ejecutadas; en rojo, el error de
        # PostgreSQL. Sin esto, un fallo de SQL no es diagnosticable y un
        # acierto no es demostrable.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESTADO: ${{ job.status }}
        run: |
          COMMIT="${{ github.sha }}"
          if [ "$ESTADO" = "success" ]; then
            {
              echo "### Esquema y seguridad · verde · \`${COMMIT:0:7}\`"
              echo
              echo "Las 5 migraciones aplican sobre PostgreSQL 15 vacío, el esquema"
              echo "resultante pasa las comprobaciones, las pruebas DML de seguridad"
              echo "pasan y las migraciones son idempotentes al reaplicarlas."
              echo
              grep -oE "[0-9]+ aserciones DML superadas" /tmp/salida-sql.log | tail -1 || true
              echo
              echo "<details><summary>Aserciones ejecutadas</summary>"
              echo
              echo '```'
              grep -oE "\[[A-Za-z0-9]+\] ok . .*" /tmp/salida-sql.log || echo "(sin detalle)"
              echo '```'
              echo
              echo "</details>"
            } > /tmp/comentario.md
          else
            {
              echo "### El trabajo de esquema ha fallado · \`${COMMIT:0:7}\`"
              echo
              echo "Últimas 150 líneas de la salida de PostgreSQL:"
              echo
              echo '```'
              tail -n 150 /tmp/salida-sql.log 2>/dev/null || echo "(sin salida)"
              echo '```'
            } > /tmp/comentario.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comentario.md

  actualizacion:
    name: Actualización desde el esquema histórico
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: ['5432:5432']

    env:
      PGPASSWORD: prueba
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: prueba

    steps:
      - uses: actions/checkout@v4

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Reproducir el estado ACTUAL de producción
        # RLS ya activa, políticas históricas permisivas con sus nombres
        # reales, el trigger de alta que ya existe, la aplicación de viajes
        # que comparte la base, y datos con la misma forma que los reales.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/00_stub_supabase.sql 2>&1 | tee -a /tmp/salida-sql.log
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/01_escenario_historico.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Comprobar que se parte de un estado REALMENTE abierto
        # Si el escenario no reproduce el problema, el resto no demostraría
        # nada: se exige que haya políticas abiertas, el trigger de alta ya
        # existente, y que group_members todavía no exista.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/02_verificar_punto_de_partida.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Fotografiar la aplicación de viajes ANTES de migrar
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/96_frontera_viajes_antes.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Aplicar 0001 sobre el estado histórico
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 --single-transaction \
               -f supabase/migrations/0001_baseline_esquema.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: El LOTE ATÓMICO aborta entero si la realidad no es la esperada
        # Cinco escenarios divergentes. Cada uno ejecuta el MISMO lote que se
        # usará en producción —0002 + 0002b con --single-transaction— y exige
        # que falle. Después, 92 comprueba que el rollback ha sido COMPLETO:
        # que `group_members` NO ha quedado creada.
        #
        # Esto es lo que la versión anterior de este CI no probaba: aplicaba
        # 0002 y 0002b en llamadas psql distintas, así que nunca ejercitó el
        # límite transaccional real.
        run: |
          set -eo pipefail
          for caso in grupo_sin_decision tercer_perfil colores_ambiguos orden_incoherente; do
            echo "── negativo: $caso" | tee -a /tmp/salida-sql.log
            cat "supabase/pruebas/negativos/$caso.sql" > /tmp/caso.sql
            echo "\\ir $PWD/supabase/lotes/pertenencia.sql" >> /tmp/caso.sql

            if psql -v ON_ERROR_STOP=1 --single-transaction -f /tmp/caso.sql \
                 >> /tmp/salida-sql.log 2>&1; then
              echo "FALLO: el lote debería haber abortado con '$caso'" | tee -a /tmp/salida-sql.log
              exit 1
            fi
            echo "   ok · abortó el lote entero" | tee -a /tmp/salida-sql.log

            # Y el rollback tiene que haber deshecho TAMBIÉN 0002.
            psql -v ON_ERROR_STOP=1 -f supabase/pruebas/92_rollback_atomico.sql \
                 2>&1 | tee -a /tmp/salida-sql.log
          done

      - name: Aplicar el LOTE ATÓMICO real, como en producción
        # Exactamente el mismo comando que ejecuta supabase/aplicar-migraciones.sh
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 --single-transaction \
               -f supabase/lotes/pertenencia.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: El lote es idempotente
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 --single-transaction \
               -f supabase/lotes/pertenencia.sql 2>&1 | tee -a /tmp/salida-sql.log
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/93_backfill_resultado.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Aplicar el resto de migraciones
        run: |
          set -eo pipefail
          for f in 0003_restricciones_indices 0004_rls 0005_realtime 0006_rls_viajes; do
            echo "── aplicando $f.sql" | tee -a /tmp/salida-sql.log
            psql -v ON_ERROR_STOP=1 --single-transaction \
                 -f "supabase/migrations/$f.sql" 2>&1 | tee -a /tmp/salida-sql.log
          done

      - name: Comprobar que la aplicación de viajes sigue intacta
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/97_frontera_viajes_despues.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: La aplicación de viajes queda cerrada
        # Sin `env:` propio: hereda el del trabajo. Ponerle uno copiado de
        # otro trabajo fue justo lo que rompió el CI.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/97b_seguridad_viajes.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Invariantes de integridad
        # Sin un solo recuento fijo, para que sirva igual aqui y contra
        # produccion, donde los numeros se mueven porque la aplicacion se usa.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/100_invariantes.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Comprobar el esquema y que no quedan políticas permisivas
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/99_comprobaciones.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Un intruso no obtiene acceso por una política antigua residual
        # Los datos históricos siguen ahí. Se comprueba con consultas reales
        # que una tercera cuenta no ve ni toca nada, que es justo lo que las
        # políticas `using (true)` permitían antes.
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/95_intruso_tras_migrar.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: El alta de un usuario nuevo crea exactamente un perfil
        run: |
          set -eo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/94_alta_de_usuario.sql 2>&1 | tee -a /tmp/salida-sql.log

      - name: Resumen del SQL ejecutado
        if: always()
        run: |
          {
            echo '### Actualización desde el esquema histórico'
            echo
            echo '```'
            tail -n 200 /tmp/salida-sql.log 2>/dev/null || echo '(sin salida)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dejar constancia del resultado en el PR
        # En verde publica QUÉ ha verificado, no solo que ha pasado. En rojo,
        # el error de PostgreSQL. Los logs de Actions no se pueden leer por
        # API, así que este es el único canal donde queda la evidencia.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESTADO: ${{ job.status }}
        run: |
          COMMIT="${{ github.sha }}"
          if [ "$ESTADO" = "success" ]; then
            {
              echo "### Actualización desde el esquema histórico · verde · \`${COMMIT:0:7}\`"
              echo
              echo "Parte del estado real de producción (RLS activa con políticas abiertas,"
              echo "el trigger de alta existente, la app de viajes y los datos históricos),"
              echo "aplica las migraciones encima y comprueba el resultado."
              echo
              echo "<details><summary>Qué ha verificado</summary>"
              echo
              echo '```'
              grep -E "Punto de partida|Política histórica retirada|política\(s\) retiradas|viajes intactas|negativo:|ok · abortó|Backfill|\[BF\]|\[RB\]|\[H0|\[U0|\[TA\]|Frontera de viajes|rollback completo" \
                   /tmp/salida-sql.log || echo "(sin detalle)"
              echo '```'
              echo
              echo "</details>"
            } > /tmp/comentario.md
          else
            {
              echo "### La actualización desde el esquema histórico ha fallado · \`${COMMIT:0:7}\`"
              echo
              echo '```'
              tail -n 150 /tmp/salida-sql.log 2>/dev/null || echo '(sin salida)'
              echo '```'
            } > /tmp/comentario.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comentario.md

  fase2:
    name: Herramientas de validación sobre copia (fase 2)
    runs-on: ubuntu-latest

    # Solo tiene sentido en la rama de fase 2. No necesita ningún secreto, no
    # toca producción y no maneja datos personales: la base es un PostgreSQL
    # vacío y desechable que crea este mismo trabajo.
    if: github.ref_name == 'fase-2/validacion-copia' || github.base_ref == 'estabilizacion/fase-1'

    # Solo para dejar la evidencia como comentario en el PR.
    # No se usa ningún secreto propio: GITHUB_TOKEN lo emite Actions.
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: desechable
          POSTGRES_DB: desechable
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de todos los scripts
        run: |
          for s in supabase/fase2/*.sh supabase/fase2/pruebas/*.sh supabase/aplicar-migraciones.sh; do
            bash -n "$s"
          done
          echo "Todos los scripts parsean"

      - name: Las guardas rechazan producción sin conectarse
        # Con un stub de psql: se comprueba que las URLs prohibidas abortan
        # ANTES de invocar psql, no solo que aborten.
        run: |
          set -eo pipefail
          supabase/fase2/pruebas/probar-guardas.sh 2>&1 | tee -a /tmp/salida-fase2.log

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: La marca de copia, contra un PostgreSQL desechable
        env:
          PGPASSWORD: desechable
        run: |
          set -eo pipefail
          supabase/fase2/pruebas/probar-marca.sh \
            "postgresql://postgres:desechable@localhost:5432/desechable" \
            2>&1 | tee -a /tmp/salida-fase2.log

      - name: La fotografía, con y sin group_members
        # El fallo real que cubre: `tomar_foto()` es `language sql`, y su cuerpo
        # se analiza al crear la función, así que una referencia literal a
        # `public.group_members` reventaba la fotografía de ANTES de migrar,
        # que es justo cuando la tabla todavía no existe.
        env:
          PGPASSWORD: desechable
        run: |
          set -eo pipefail
          psql "postgresql://postgres:desechable@localhost:5432/desechable" \
               -X -q -c 'create database foto_desechable'
          supabase/fase2/pruebas/probar-foto.sh \
            "postgresql://postgres:desechable@localhost:5432/foto_desechable" \
            2>&1 | tee -a /tmp/salida-fase2.log

      - name: Ninguna referencia a producción fuera de la guarda
        run: |
          ARCHIVOS=$(grep -rl 'cmkzcvfjgrgxwqjimtxa' supabase/fase2 || true)
          ESPERADOS="supabase/fase2/guarda-no-produccion.sh
          supabase/fase2/pruebas/probar-guardas.sh"
          if [ "$(echo "$ARCHIVOS" | sort | tr -d ' ')" != "$(echo "$ESPERADOS" | sort | tr -d ' ')" ]; then
            echo "La referencia del proyecto aparece donde no debe:" >&2
            echo "$ARCHIVOS" >&2
            exit 1
          fi
          echo "La referencia solo aparece en la guarda y en su prueba"

      - name: Ningún secreto ni dato personal
        run: |
          set -e
          ! grep -rlE "eyJ[A-Za-z0-9_-]{20,}" supabase/fase2 docs/FASE-2-VALIDACION-COPIA.md
          ! grep -rlE "postgres(ql)?://[^ '\"]*:[^ '\"]*@" supabase/fase2/*.sh supabase/fase2/*.sql
          echo "Sin tokens ni cadenas de conexión con credenciales"

      - name: Dejar constancia de las guardas en el PR
        # Mismo motivo que en el trabajo de esquema: los logs de Actions no se
        # pueden leer por API, así que la evidencia de que una URL de
        # producción aborta ANTES de invocar psql se publica aquí.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESTADO: ${{ job.status }}
        run: |
          COMMIT="${{ github.sha }}"
          if [ "$ESTADO" = "success" ]; then
            {
              echo "### Herramientas de copia (fase 2) · verde · \`${COMMIT:0:7}\`"
              echo
              echo "Las guardas se prueban con un stub de \`psql\` que anota cada"
              echo "invocación: así se demuestra que una URL de producción aborta"
              echo "**antes** de conectarse, no solo que aborta. La marca de copia"
              echo "se prueba contra un PostgreSQL vacío y desechable creado por"
              echo "este mismo trabajo. Ni secretos, ni producción, ni datos personales."
              echo
              grep -oE "[0-9]+/[0-9]+ aserciones superadas" /tmp/salida-fase2.log | tail -2 || true
              echo
              echo "<details><summary>Aserciones ejecutadas</summary>"
              echo
              echo '```'
              grep -E "^[[:space:]]+\[[A-Za-z0-9-]+\] ok " /tmp/salida-fase2.log || echo "(sin detalle)"
              echo '```'
              echo
              echo "</details>"
            } > /tmp/comentario-fase2.md
          else
            {
              echo "### Las herramientas de copia han fallado · \`${COMMIT:0:7}\`"
              echo
              echo "Últimas 150 líneas de la salida:"
              echo
              echo '```'
              tail -n 150 /tmp/salida-fase2.log 2>/dev/null || echo "(sin salida)"
              echo '```'
            } > /tmp/comentario-fase2.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comentario-fase2.md
